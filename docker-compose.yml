services:
  postgres:
    image: postgres:16-alpine
    container_name: global-postgres
    restart: unless-stopped
    # `.env` butunlay container'ga uzatiladi — bu dinamik DB_<NAME>_PASSWORD
    # o'zgaruvchilarini init script ko'rishi uchun zarur.
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_USER}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    # Port faqat serverning localhost'iga bog'lanadi — internet tomondan kirib bo'lmaydi.
    # Tashqaridan (DBeaver/pgAdmin) ulanish uchun SSH tunnel ishlating.
    # Boshqa loyihalarning Docker konteynerlari `global-postgres:5432`'ga muammosiz ulanadi.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - global-net

  redis:
    image: redis:7-alpine
    container_name: global-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    # Faqat localhost'ga bog'lanadi — local dev'da .NET ilovasi `localhost:6379`'ga ulanadi.
    # Docker konteynerlari esa `global-redis:6379`'ga muammosiz ulanaveradi.
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - global-net

networks:
  global-net:
    name: global-app-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
